<style>
/* ===== SALMAN UTASA — shared design system ===== */
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-ExtraLight.ttf") format("truetype");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Light.ttf") format("truetype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Black.ttf") format("truetype");font-weight:900;font-style:normal;font-display:swap}
/* =====================================================================
   SALMAN UTASA — "Light Glass + Neon"
   Concept: frosted glass panels floating over a slowly moving aurora of
   violet / cyan / pink light. Neon glows mark everything interactive.
   One font family (Tajawal) — contrast comes from weight and size.
   ===================================================================== */
:root{
  /* palette */
  --primary:#6c5ce7; --primary-dark:#5847d8; --primary-soft:rgba(108,92,231,.12);
  --cyan:#00cec9; --pink:#f472b6; --secondary:#00b5b0;
  --bg:#eef0fb;
  --surface:rgba(255,255,255,.62); --surface-strong:rgba(255,255,255,.82); --sunk:rgba(255,255,255,.45);
  --line:rgba(255,255,255,.75); --line-strong:rgba(108,92,231,.22); --hair:rgba(45,40,110,.08);
  --ink:#1b1840; --muted:#55577a; --faint:#8586a6;
  --good:#0b8a6a; --good-soft:rgba(0,184,148,.14); --warn:#9a6a0b; --warn-soft:rgba(240,170,40,.16);
  --bad:#c8283f; --bad-soft:rgba(244,63,94,.12);
  /* depth & light */
  --blur:blur(18px) saturate(170%);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 10px 30px -8px rgba(60,50,160,.16), 0 2px 6px rgba(60,50,160,.06);
  --shadow-hover:0 1px 0 rgba(255,255,255,.95) inset, 0 22px 50px -12px rgba(108,92,231,.38), 0 0 0 1px rgba(108,92,231,.25), 0 0 32px rgba(0,206,201,.18);
  --neon:0 0 0 1px rgba(255,255,255,.35) inset, 0 8px 24px rgba(108,92,231,.45), 0 0 26px rgba(0,206,201,.35);
  --grad:linear-gradient(120deg,#7b5cff 0%,#6c5ce7 40%,#00c4d6 100%);
  --grad-btn:var(--grad);
  --grad-text:linear-gradient(100deg,#5b43f0 0%,#8b5cf6 35%,#00b8d4 70%,#5b43f0 100%);
  /* type */
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif; --f-brand:var(--f-body); --f-word:var(--f-body);
  --radius:20px; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
a,button,select,summary,label{-webkit-tap-highlight-color:transparent}
img{max-width:100%}
::selection{background:rgba(108,92,231,.25)}

/* ---------- animated background: aurora blobs + particle canvas ---------- */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:
  radial-gradient(1200px 600px at 100% -10%, #e4e0ff 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 30%, #d9f7f7 0%, transparent 60%),
  linear-gradient(180deg,#f3f2ff 0%,#eef0fb 50%,#f6eefb 100%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.aurora .a1{width:46vmax;height:46vmax;background:#a99bff;top:-18vmax;right:-10vmax;animation:float1 22s ease-in-out infinite alternate}
.aurora .a2{width:40vmax;height:40vmax;background:#7ff0ea;bottom:-16vmax;left:-12vmax;animation:float2 26s ease-in-out infinite alternate}
.aurora .a3{width:30vmax;height:30vmax;background:#ffb3dd;top:38%;left:42%;opacity:.35;animation:float3 30s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(-12vmax,10vmax) scale(1.15)}}
@keyframes float2{to{transform:translate(14vmax,-8vmax) scale(1.1)}}
@keyframes float3{to{transform:translate(-10vmax,-12vmax) scale(1.25)}}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

.shell{max-width:1080px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}

/* ---------- header (glass bar) ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.55);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.8);box-shadow:0 6px 24px -12px rgba(60,50,160,.18)}
.topbar .shell{display:flex;align-items:center;gap:24px;min-height:70px}
.brand{order:0;display:flex;align-items:center;gap:11px;text-decoration:none;flex:none;direction:ltr}
.brand .mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:var(--neon)}
.brand .word{font-weight:800;font-size:1.2rem;letter-spacing:.02em;color:var(--ink);line-height:1.2}
.nav{order:1;display:flex;gap:6px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none;padding:4px}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;white-space:nowrap;font-size:.95rem;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;transition:color .25s, background .25s, box-shadow .25s}
.nav a i{font-size:.82rem;opacity:.75}
.nav a:hover{color:var(--primary);background:rgba(255,255,255,.7)}
.nav a.on{color:#fff;background:var(--grad);box-shadow:none}
.nav a.on i{opacity:1}
@media (max-width:820px){
  .topbar .shell{flex-wrap:wrap;gap:0;min-height:0;padding-top:12px;padding-bottom:8px}
  .nav{margin-inline-start:0;width:100%;order:3;margin-top:8px;padding:2px}
  .nav a{padding:8px 12px;font-size:.9rem}
}
@media (max-width:480px){ .nav{justify-content:space-between;gap:2px} .nav a{padding:7px 9px;font-size:.84rem} .nav a i{display:none} }

/* language switch */
.lang{order:2;font:inherit;font-size:.88rem;font-weight:700;color:var(--primary);background:rgba(255,255,255,.7);border:1px solid var(--line-strong);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;flex:none;transition:box-shadow .25s, border-color .25s}
.lang:hover{border-color:var(--primary);box-shadow:0 0 18px rgba(108,92,231,.3)}
.lang i{font-size:.85rem}
@media (max-width:820px){ .lang{margin-inline-start:auto} }

/* ---------- page frame ---------- */
.page{padding-block:44px 24px;display:flex;flex-direction:column;gap:28px}
.page-head{position:relative;display:flex;flex-direction:column;gap:10px;padding:30px;border-radius:var(--radius);background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.page-head::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--grad);opacity:.9;box-shadow:0 0 18px rgba(0,206,201,.6)}
.page-head .kicker{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;width:fit-content;padding:4px 12px;border-radius:999px;color:var(--primary);background:var(--primary-soft);direction:ltr}
.page-head h1{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:900;line-height:1.2;background:var(--grad-text);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s linear infinite}
.page-head p{color:var(--muted);font-size:1.03rem;max-width:62ch}
@keyframes sheen{to{background-position:-200% 0}}
h1,h2,h3{text-wrap:balance}
.grad-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- surfaces ---------- */
.glass{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{font-size:1.18rem;font-weight:800;display:flex;align-items:center;gap:10px}
.section-title i{color:var(--primary);font-size:1rem;filter:drop-shadow(0 0 8px rgba(108,92,231,.5))}

/* list item used on every page (glass tile) */
.item{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);min-width:0;box-shadow:var(--shadow);transition:box-shadow .3s, background .3s}
.item:hover{background:var(--surface-strong);box-shadow:var(--shadow-hover)}
.item .ic{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:18px;transition:background .3s,color .3s,box-shadow .3s}
.item:hover .ic{background:var(--grad);color:#fff;box-shadow:var(--neon)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-size:1rem;font-weight:700;line-height:1.45}
.item .tx span{font-size:.86rem;color:var(--muted);line-height:1.5}
.item .go{flex:none;color:var(--faint);font-size:.8rem;transition:color .25s, transform .25s}
.item:hover .go{color:var(--primary);transform:translateX(-3px)}

/* ---------- buttons ---------- */
.btn{position:relative;font:inherit;font-weight:800;border:0;cursor:pointer;border-radius:14px;padding:12px 22px;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;transition:box-shadow .3s, background .3s, color .3s, border-color .3s}
.btn-grad{background:var(--grad);background-size:160% 100%;color:#fff;box-shadow:var(--neon);transition:box-shadow .3s, background-position .5s}
.btn-grad:hover{background-position:100% 0;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset, 0 12px 34px rgba(108,92,231,.55), 0 0 40px rgba(0,206,201,.5)}
.btn-soft{background:rgba(255,255,255,.7);color:var(--primary);border:1px solid var(--line-strong)}
.btn-soft:hover{border-color:var(--primary);box-shadow:0 0 20px rgba(108,92,231,.25)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:10px}

.socials{display:flex;gap:10px}
.socials a{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;text-decoration:none;color:var(--primary);background:rgba(255,255,255,.7);border:1px solid var(--line-strong);transition:background .3s,color .3s,box-shadow .3s}
.socials a:hover{background:var(--grad);color:#fff;box-shadow:var(--neon)}

/* ---------- footer ---------- */
.foot{margin-top:48px;border-top:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.45);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.foot .shell{display:flex;justify-content:center;padding-block:22px}
.foot p{font-size:.88rem;color:var(--faint)}

/* ---------- motion: intro, reveal, tilt ---------- */
.intro{animation:introUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes introUp{from{opacity:.001;transform:translateY(22px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.topbar.intro{animation-name:introDown;animation-duration:.6s}
@keyframes introDown{from{opacity:.001;transform:translateY(-16px)}to{opacity:1;transform:none}}
.rv-hide{opacity:.001;transform:translateY(28px) scale(.97)}
.rv-show{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1)}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.65), transparent 55%)}
.tilt:hover .glare{opacity:.6}

/* ---------- custom cursor (fine pointers only, added by JS) ---------- */
.cur-dot,.cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%)}
.cur-dot{width:7px;height:7px;background:var(--primary);box-shadow:0 0 10px rgba(108,92,231,.9)}
.cur-ring{width:34px;height:34px;border:1.5px solid rgba(108,92,231,.55);transition:width .25s,height .25s,border-color .25s,background .25s}
.cur-ring.hot{width:58px;height:58px;border-color:rgba(0,206,201,.8);background:rgba(0,206,201,.08);box-shadow:0 0 24px rgba(0,206,201,.35)}
.cur-ring.down{width:24px;height:24px}

/* typing caret for page headlines */
.caret{display:inline-block;width:3px;height:.95em;margin-inline-start:4px;vertical-align:-.1em;background:var(--grad);box-shadow:0 0 10px rgba(0,206,201,.8);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* English (LTR) fixes */
html[dir="ltr"] .fa-arrow-left::before{content:"\f061"}
html[dir="ltr"] .fa-chevron-left::before{content:"\f054"}
html[dir="ltr"] .item:hover .go{transform:translateX(3px)}

/* reduced motion: keep the look, drop the movement */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv-hide{opacity:1;transform:none}
}
.tilt{position:relative;transition:transform .18s ease-out, box-shadow .3s, background .3s}
/* nav: no glow or square highlight on any item, in either language */
.nav a,.nav a:hover,.nav a.on,.nav a:active,.nav a:focus{box-shadow:none;outline:none}
.nav a:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:999px}
.lang:focus{outline:none} .lang:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:999px}
/* phones: 5 menu items wrap onto two centred lines instead of scrolling off-screen */
@media (max-width:520px){ .nav{flex-wrap:wrap;justify-content:center;overflow:visible;gap:4px} .nav a{padding:6px 11px;font-size:.86rem} }

</style>
<style>
/* rules: standard page head + two-column list of video items */
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item .tx span{direction:ltr;text-align:right}
html[dir="ltr"] .item .tx span{text-align:left}
@media (max-width:720px){ .list{grid-template-columns:1fr} }
</style>

</head>

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    <span class="ic"><i class="fa-solid ${v.icon}"></i></span>
    <span class="tx">${LANG === 'en' ? `<b>${esc(v.en.replace(/\.$/,''))}</b>` : `<b>${esc(v.t)}</b><span>${esc(v.en)}</span>`}</span>
    <i class="go fa-solid fa-arrow-up-right-from-square"></i>
  </a>`).join(''); }
render(); document.addEventListener('langchange', render);
</script>

<footer class="foot">
  <div class="shell"><p>© <span class="yr"></span> <span data-en="Salman Utasa">سلمان يوتاسا</span></p></div>
</footer>
<script>
(function(){
  function applyLang(){
    var en = LANG === 'en';
    document.documentElement.lang = LANG; document.documentElement.dir = en ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-en]').forEach(function(el){
      if (!el.hasAttribute('data-ar')) el.setAttribute('data-ar', el.innerHTML);
      el.innerHTML = en ? el.getAttribute('data-en') : el.getAttribute('data-ar');
    });
    document.getElementById('langTxt').textContent = en ? 'العربية' : 'English';
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'ar' : 'en';
    try{ localStorage.setItem('su-lang', LANG); }catch(e){}
    applyLang();
    document.dispatchEvent(new Event('langchange'));
  });
  applyLang();
  document.querySelectorAll('.yr').forEach(function(e){ e.textContent = new Date().getFullYear(); });
})();
</script>
<script>
/* =====================================================================
   SALMAN UTASA — interaction layer (no libraries)
   Every effect checks prefers-reduced-motion and touch support first.
   ===================================================================== */
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------- 1. Particle field: soft drifting dots linked by faint lines ---------- */
  (function particles() {
    var cv = document.getElementById('particles');
    if (!cv) return;
    var ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W, H, dots = [], mouse = { x: -999, y: -999 };
    var COLORS = ['108,92,231', '0,206,201', '244,114,182'];
    function size() {
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(70, (W * H) / 22000));
      dots = Array.from({ length: n }, function () {
        return { x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
                 r: Math.random() * 2 + 1, c: COLORS[(Math.random() * COLORS.length) | 0] };
      });
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        if (!reduce) {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0 || d.x > W) d.vx *= -1;
          if (d.y < 0 || d.y > H) d.vy *= -1;
          var mx = d.x - mouse.x, my = d.y - mouse.y, md = mx * mx + my * my;   // gentle push away from cursor
          if (md < 12000) { d.x += mx * .012; d.y += my * .012; }
        }
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283);
        ctx.fillStyle = 'rgba(' + d.c + ',.55)'; ctx.fill();
        for (var j = i + 1; j < dots.length; j++) {
          var e = dots[j], dx = d.x - e.x, dy = d.y - e.y, dist = dx * dx + dy * dy;
          if (dist < 14000) {
            ctx.strokeStyle = 'rgba(108,92,231,' + (0.12 * (1 - dist / 14000)) + ')';
            ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(e.x, e.y); ctx.stroke();
          }
        }
      }
      if (!reduce && !document.hidden) requestAnimationFrame(draw);
    }
    size(); draw();
    window.addEventListener('resize', function () { size(); if (reduce) draw(); });
    window.addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !reduce) requestAnimationFrame(draw); });
  })();

  /* ---------- 2. Page-load intro: header, then main blocks in sequence ---------- */
  (function intro() {
    if (reduce) return;
    var top = document.querySelector('.topbar');
    if (top) top.classList.add('intro');
    var blocks = document.querySelectorAll('.hero > *, .page-head, main.page > section, main .wrap > section');
    var n = 0;
    blocks.forEach(function (el) {
      if (el.getBoundingClientRect().top > window.innerHeight) return;   // below the fold: scroll reveal handles it
      el.style.animationDelay = (0.12 + n++ * 0.09) + 's';
      el.classList.add('intro');
      el.dataset.introduced = '1';
    });
  })();

  /* ---------- 3. Scroll reveal for anything that starts below the fold ---------- */
  (function reveal() {
    if (reduce || !('IntersectionObserver' in window)) return;
    var targets = document.querySelectorAll('.card-link, .item, main .wrap > section, main.page > section, .contact');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target;
        el.classList.add('rv-show'); el.classList.remove('rv-hide');
        io.unobserve(el);
        setTimeout(function () { el.classList.remove('rv-show'); }, 800);   // hand transforms back to tilt
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    var stagger = 0;
    targets.forEach(function (el) {
      if (el.dataset.introduced || el.closest('[data-introduced]')) return;
      if (el.getBoundingClientRect().top < window.innerHeight * .92) return;   // already visible at load
      el.classList.add('rv-hide');
      el.style.transitionDelay = ((stagger++ % 4) * 0.06) + 's';
      io.observe(el);
    });
  })();

  /* ---------- 4. Hero parallax (index): layers drift with mouse and scroll ---------- */
  (function parallax() {
    var layers = document.querySelectorAll('[data-depth]');
    if (!layers.length || reduce) return;
    var mx = 0, my = 0, sy = 0, raf = 0;
    function apply() {
      raf = 0;
      layers.forEach(function (l) {
        var d = parseFloat(l.dataset.depth);
        l.style.transform = 'translate3d(' + (mx * d * 30) + 'px,' + (my * d * 30 - sy * d * .35) + 'px,0)';
      });
    }
    function queue() { if (!raf) raf = requestAnimationFrame(apply); }
    window.addEventListener('pointermove', function (e) {
      mx = e.clientX / window.innerWidth - .5; my = e.clientY / window.innerHeight - .5; queue();
    }, { passive: true });
    window.addEventListener('scroll', function () { sy = window.scrollY; queue(); }, { passive: true });
  })();

  /* ---------- 5. Custom cursor: dot + trailing ring that grows on interactive things ---------- */
  (function cursor() {
    if (!finePointer || reduce) return;
    var dot = document.createElement('div'), ring = document.createElement('div');
    dot.className = 'cur-dot'; ring.className = 'cur-ring';
    document.body.append(dot, ring);
    var x = -100, y = -100, rx = -100, ry = -100;
    window.addEventListener('pointermove', function (e) {
      x = e.clientX; y = e.clientY;
      dot.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%)';
    }, { passive: true });
    (function loop() {
      rx += (x - rx) * .18; ry += (y - ry) * .18;
      ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';
      requestAnimationFrame(loop);
    })();
    var HOT = 'a, button, select, input, label, summary, [data-tilt]';
    document.addEventListener('pointerover', function (e) { if (e.target.closest(HOT)) ring.classList.add('hot'); });
    document.addEventListener('pointerout', function (e) { if (e.target.closest(HOT)) ring.classList.remove('hot'); });
    document.addEventListener('pointerdown', function () { ring.classList.add('down'); });
    document.addEventListener('pointerup', function () { ring.classList.remove('down'); });
    document.addEventListener('mouseleave', function () { dot.style.opacity = ring.style.opacity = 0; });
    document.addEventListener('mouseenter', function () { dot.style.opacity = ring.style.opacity = 1; });
  })();

  /* ---------- 6. 3D tilt + glare on cards (delegated, so re-rendered lists work too) ---------- */
  (function tilt() {
    if (!finePointer || reduce) return;
    var SEL = '.card-link, .item, .tile, .course';
    var current = null;
    function reset(el) { el.style.transform = ''; }
    document.addEventListener('pointermove', function (e) {
      var el = e.target.closest(SEL);
      if (current && current !== el) { reset(current); current = null; }
      if (!el) return;
      if (!el.classList.contains('tilt')) {
        el.classList.add('tilt'); el.dataset.tilt = '';
        var g = document.createElement('span'); g.className = 'glare'; el.appendChild(g);
      }
      current = el;
      var r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      var max = el.classList.contains('item') ? 5 : 8;
      el.style.transform = 'perspective(900px) rotateX(' + ((.5 - py) * max) + 'deg) rotateY(' + ((px - .5) * max) + 'deg) translateY(-3px)';
      el.style.setProperty('--gx', (px * 100) + '%'); el.style.setProperty('--gy', (py * 100) + '%');
    }, { passive: true });
    document.addEventListener('pointerleave', function () { if (current) reset(current); }, true);
  })();

  /* ---------- 7. Magnetic buttons: pulled a little toward the pointer ---------- */
  (function magnetic() {
    if (!finePointer || reduce) return;
    var SEL = '.btn, .lang, .socials a, .brand .mark';
    document.addEventListener('pointermove', function (e) {
      document.querySelectorAll(SEL).forEach(function (b) {
        var r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy, reach = Math.max(r.width, r.height) * .9;
        if (Math.abs(dx) < reach && Math.abs(dy) < reach) b.style.transform = 'translate(' + dx * .22 + 'px,' + dy * .3 + 'px)';
        else if (b.style.transform) b.style.transform = '';
      });
    }, { passive: true });
  })();

  /* ---------- 8. Text scramble on the home wordmark ---------- */
  function scramble(node, finalText, delay) {
    var CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#%&*+=<>';
    var frame = 0, total = 28 + finalText.length * 2;
    setTimeout(function step() {
      var out = '';
      for (var i = 0; i < finalText.length; i++) {
        var settle = (i / finalText.length) * total * .7 + 8;
        out += (frame >= settle || finalText[i] === ' ') ? finalText[i] : CH[(Math.random() * CH.length) | 0];
      }
      node.textContent = out;
      if (++frame <= total) requestAnimationFrame(step); else node.textContent = finalText;
    }, delay || 0);
  }
  (function wordmark() {
    var wm = document.querySelector('.wordmark');
    if (!wm || reduce) return;
    wm.querySelectorAll('[data-scramble]').forEach(function (n, i) { scramble(n, n.textContent, 250 + i * 180); });
  })();

  /* ---------- 9. Typing effect on page headlines (runs once per load) ---------- */
  (function typing() {
    var h = document.querySelector('.page-head h1');
    if (!h || reduce) return;
    var text = h.textContent, i = 0, caret = document.createElement('span');
    caret.className = 'caret';
    h.textContent = ''; h.appendChild(caret);
    h.style.minHeight = '1.2em';
    (function type() {
      if (i <= text.length) {
        h.textContent = text.slice(0, i); h.appendChild(caret);
        i += 1; setTimeout(type, 45);
      } else setTimeout(function () { caret.remove(); }, 900);
    })();
    // if the language switches mid-typing, the swap restores the full text; just drop the caret
    document.addEventListener('langchange', function () { i = text.length + 1; caret.remove(); });
  })();
})();
</script>
