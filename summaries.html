<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-en="IT Courses – Salman Utasa">شروحات مواد IT – سلمان UTASA</title>
<script>var LANG=(function(){try{return localStorage.getItem('su-lang')||'ar'}catch(e){return 'ar'}})();document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl';function L(a,e){return LANG==='en'?e:a}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ===== SALMAN UTASA — shared design system ===== */
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-ExtraLight.ttf") format("truetype");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Light.ttf") format("truetype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"Tajawal";src:url("fonts/Tajawal-Black.ttf") format("truetype");font-weight:900;font-style:normal;font-display:swap}
/* Formal system: white surfaces, hairline borders, one accent (purple), Tajawal only */
:root{
  --primary:#6c5ce7; --primary-dark:#5847d8; --primary-soft:#efecfe; --secondary:#00b5b0;
  --bg:#f5f5fb; --surface:#ffffff; --sunk:#f8f7fd; --line:#e7e6f2; --line-strong:#d7d5e8;
  --ink:#1d1b3a; --muted:#5b5c7c; --faint:#8b8ca8;
  --good:#0f8a6c; --good-soft:#e5f5f0; --warn:#9a6a0b; --warn-soft:#fbf1dc; --bad:#c8283f; --bad-soft:#fdebee;
  --shadow:0 1px 2px rgba(30,33,64,.04), 0 4px 14px rgba(30,33,64,.04);
  --shadow-hover:0 2px 4px rgba(30,33,64,.05), 0 10px 26px rgba(30,33,64,.08);
  --grad:linear-gradient(135deg,#7464f0,#5847d8); --grad-btn:linear-gradient(135deg,#7464f0,#5847d8);
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif; --f-brand:var(--f-body); --f-word:"Pacifico","Tajawal",cursive;
  --radius:14px; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:linear-gradient(180deg,#efedfd 0px,var(--bg) 420px) no-repeat,var(--bg);color:var(--ink);line-height:1.7;font-size:16px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%}
.atmo{display:none}

.shell{max-width:1060px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}

/* header */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .shell{display:flex;align-items:center;gap:24px;min-height:68px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none;direction:ltr}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:16px}
.brand .word{font-family:var(--f-word);font-weight:400;font-size:1.3rem;letter-spacing:.01em;color:var(--ink);line-height:1.2}
.brand{order:0}
.nav{order:1;display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;white-space:nowrap;font-size:.95rem;font-weight:500;color:var(--muted);padding:0 14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.nav a i{font-size:.82rem;color:var(--faint);transition:color .2s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.nav a.on i{color:var(--primary)}
@media (max-width:820px){
  .topbar .shell{flex-wrap:wrap;gap:0;min-height:0;padding-top:12px}
  .nav{margin-inline-start:0;width:100%;order:2;margin-top:8px}
  .nav a{padding:10px 10px;font-size:.9rem}
}
@media (max-width:480px){ .nav{justify-content:space-between} .nav a{padding:10px 4px;font-size:.88rem} .nav a i{display:none} }

/* page frame */
.page{padding-block:40px 24px;display:flex;flex-direction:column;gap:28px}
.page-head{display:flex;flex-direction:column;gap:8px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.page-head .kicker{font-size:.85rem;font-weight:700;color:var(--primary);letter-spacing:.02em}
.page-head h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:800;line-height:1.25;color:var(--ink)}
.page-head p{color:var(--muted);font-size:1.02rem;max-width:62ch}
h1,h2,h3{text-wrap:balance}
.grad-text{color:var(--primary)}

/* surfaces */
.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:10px}
.section-title i{color:var(--primary);font-size:1rem}

/* list item used on every page */
.item{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);min-width:0;transition:border-color .2s, box-shadow .2s}
.item:hover{border-color:#b9b0f6;box-shadow:var(--shadow-hover)}
.item .ic{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:18px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-size:1rem;font-weight:700;line-height:1.45}
.item .tx span{font-size:.86rem;color:var(--muted);line-height:1.5}
.item .go{flex:none;color:var(--faint);font-size:.8rem;transition:color .2s, transform .2s}
.item:hover .go{color:var(--primary);transform:translateX(-3px)}

/* buttons & inputs */
.btn{font:inherit;font-weight:700;border:0;cursor:pointer;border-radius:10px;padding:11px 20px;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.btn-grad{background:var(--grad-btn);color:#fff;box-shadow:0 4px 12px rgba(108,92,231,.25)}
.btn-grad:hover{filter:brightness(1.06)}
.btn-soft{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-soft:hover{border-color:var(--primary);color:var(--primary)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}

.socials{display:flex;gap:8px}
.socials a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--primary);background:var(--primary-soft);transition:background .2s,color .2s}
.socials a:hover{background:var(--primary);color:#fff}

/* footer */
.foot{margin-top:48px;border-top:1px solid var(--line);background:var(--surface)}
.foot .shell{display:flex;justify-content:center;padding-block:22px}
.foot p{font-size:.88rem;color:var(--faint)}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none!important;scroll-behavior:auto!important} }

/* language switch */
.lang{order:2;font:inherit;font-size:.88rem;font-weight:700;color:var(--primary);background:var(--primary-soft);border:1px solid transparent;border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;flex:none;transition:border-color .2s}
.lang:hover{border-color:var(--primary)}
.lang i{font-size:.85rem}
@media (max-width:820px){ .nav{order:3} .lang{margin-inline-start:auto} }
/* English (LTR) fixes */
html[dir="ltr"] .fa-arrow-left::before{content:"\f061"}
html[dir="ltr"] .fa-chevron-left::before{content:"\f054"}
html[dir="ltr"] .item:hover .go{transform:translateX(3px)}

</style>
<style>
/* summaries: standard page head + playlist items + contact block */
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item .tx b{direction:ltr;text-align:right}
html[dir="ltr"] .item .tx b{text-align:left}
.item .tx span{color:var(--primary);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.contact{padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.contact .lines{display:flex;flex-direction:column;gap:4px}
.contact p{font-size:.95rem;color:var(--muted)}
.contact p a{color:var(--primary);font-weight:700;text-decoration:none}
@media (max-width:900px){ .list{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .list{grid-template-columns:1fr} }
</style>

</head>
<body>
<header class="topbar">
  <div class="shell">
    <a class="brand" href="index.html" aria-label="SALMAN UTASA — الصفحة الرئيسية">
      <span class="mark"><i class="fa-solid fa-graduation-cap"></i></span>
      <span class="word">Salman <span style="color:var(--primary)">Utasa</span></span>
    </a>
    <nav class="nav" aria-label="صفحات الموقع">
      <a href="index.html"><i class="fa-solid fa-house"></i><span data-en="Home">الرئيسية</span></a>
      <a href="utas-rules.html"><i class="fa-solid fa-book-open"></i><span data-en="UTAS Rules">قوانين UTAS</span></a>
      <a href="summaries.html" class="on" aria-current="page"><i class="fa-solid fa-laptop-code"></i><span data-en="IT Courses">شروحات IT</span></a>
      <a href="calculator.html"><i class="fa-solid fa-calculator"></i><span data-en="GPA Calculator">حاسبة المعدل</span></a>
    </nav>
    <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><i class="fa-solid fa-globe"></i><span id="langTxt">English</span></button>
  </div>
</header>

<main class="shell page">
  <header class="page-head">
    <span class="kicker">IT Courses</span>
    <h1 data-en="IT Course Explanations">شروحات مواد IT</h1>
    <p data-en="A complete playlist for all Information Technology courses">قائمة تشغيل شاملة لكل مواد تقنية المعلومات</p>
  </header>
  <h2 class="section-title"><i class="fa-brands fa-youtube"></i><span data-en="YouTube playlists">قوائم التشغيل على يوتيوب</span></h2>
  <section class="list" id="subjectsGrid"></section>
  <section class="contact glass">
    <div class="lines">
      <p><span data-en="Follow me on Instagram:">تابعني على إنستغرام:</span> <a href="https://instagram.com/salmanutasa" target="_blank" rel="noopener">@salmanutasa</a></p>
      <p><span data-en="My website:">موقعي الإلكتروني:</span> <a href="https://salmanutasa.my.canva.site" target="_blank" rel="noopener">salmanutasa.my.canva.site</a></p>
    </div>
    <div class="socials">
      <a href="https://instagram.com/salman_utasa" target="_blank" rel="noopener" aria-label="إنستغرام"><i class="fab fa-instagram"></i></a>
      <a href="https://twitter.com/salman_utasa" target="_blank" rel="noopener" aria-label="تويتر"><i class="fab fa-twitter"></i></a>
      <a href="https://www.youtube.com/@SALMAN_UTASA/playlists" target="_blank" rel="noopener" aria-label="يوتيوب"><i class="fab fa-youtube"></i></a>
    </div>
  </section>
</main>
<script>
const SUBJECTS = [
  { name:"Advanced Web Technologies",                 icon:"fa-globe",                url:"https://youtube.com/playlist?list=PLaw4yJSjRAQFeQ2HhsRcRgLQMdviKKAeM&si=xV5-deOgjU1_CLo5" },
  { name:"Web Application Security",                  icon:"fa-shield-halved",        url:"https://youtube.com/playlist?list=PLaw4yJSjRAQFxpomQV26kPqqXsrjYLyrH&si=qyDeEw3NY3nLTIKp" },
  { name:"Probability and Statistics",                icon:"fa-chart-bar",            url:"https://youtube.com/playlist?list=PLaw4yJSjRAQEviaEju1H_j-clRJ7Z2G-8&si=cLcSXgS3WUG9ByHj" },
  { name:"Mobile Application Development",            icon:"fa-mobile-screen-button", url:"https://youtube.com/playlist?list=PLaw4yJSjRAQHV-PJEcSM2kmrYn0N2iHnI&si=ZTDi4QNdPd0ukJpK" },
  { name:"Full-Stack Web Development",                icon:"fa-layer-group",          url:"https://youtube.com/playlist?list=PLaw4yJSjRAQF35rIKXCQmVKgD6Lf53Ewl&si=Gwl4QiAYgHlDsKbg" },
  { name:"Introduction to Artificial Intelligence",   icon:"fa-brain",                url:"https://youtube.com/playlist?list=PLaw4yJSjRAQE-dBKflr7DqqmjKGv4gS8B&si=NkQPE5J9hJO8XrEf" },
  { name:"Computer Architecture & Organization",      icon:"fa-microchip",            url:"https://youtube.com/playlist?list=PLaw4yJSjRAQH3HSLGs35uv-jRlBMW8Cew&si=vrjjqXShqkJwCixM" },
  { name:"Mathematics of Computing",                  icon:"fa-square-root-variable", url:"https://youtube.com/playlist?list=PLaw4yJSjRAQEFJHlvrVFoZjbockWnAHrr&si=X-1m-iD6bfMLAuXc" },
  { name:"Cloud Computing Fundamentals",              icon:"fa-cloud",                url:"https://youtube.com/playlist?list=PLaw4yJSjRAQHBnOphEnzlMc7ZF0diQUb-&si=CsNN1ZAVKR5j78aD" },
  { name:"Web Development II",                        icon:"fa-pen-to-square",        url:"https://youtube.com/playlist?list=PLaw4yJSjRAQEEEGk7kjL9RIlIV0i1tSPB&si=7pJMRC-Bc61NGInv" },
  { name:"Research Methodology",                      icon:"fa-flask",                url:"https://youtube.com/playlist?list=PLaw4yJSjRAQGkD6VovbyXOe0A8fCTx7IF&si=Ji_4aG0BmkwyE-jB" },
  { name:"Fundamentals of Computing & Info Systems",  icon:"fa-computer",             url:"https://youtube.com/playlist?list=PLaw4yJSjRAQErusON8ePhhAv9lqNoHbTr&si=g4V68EFQpR5i5MQ_" },
  { name:"Project Management & Acquisition",          icon:"fa-diagram-project",      url:"https://youtube.com/playlist?list=PLaw4yJSjRAQG8HgK5q5E26I_DUC-kFs5G&si=vSdzgfxrBTtGueo4" },
];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){ document.getElementById('subjectsGrid').innerHTML = SUBJECTS.map(s => `
  <a class="item" href="${s.url}" target="_blank" rel="noopener">
    <span class="ic"><i class="fa-solid ${s.icon}"></i></span>
    <span class="tx"><b>${esc(s.name)}</b><span><i class="fa-brands fa-youtube"></i>${L('مشاهدة القائمة','Watch playlist')}</span></span>
    <i class="go fa-solid fa-arrow-up-right-from-square"></i>
  </a>`).join(''); }
render(); document.addEventListener('langchange', render);
</script>

<footer class="foot">
  <div class="shell"><p>© <span class="yr"></span> <span data-en="Salman Utasa">سلمان يوتاسا</span></p></div>
</footer>
<script>
(function(){
  function applyLang(){
    var en = LANG === 'en';
    document.documentElement.lang = LANG; document.documentElement.dir = en ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-en]').forEach(function(el){
      if (!el.hasAttribute('data-ar')) el.setAttribute('data-ar', el.innerHTML);
      el.innerHTML = en ? el.getAttribute('data-en') : el.getAttribute('data-ar');
    });
    document.getElementById('langTxt').textContent = en ? 'العربية' : 'English';
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'ar' : 'en';
    try{ localStorage.setItem('su-lang', LANG); }catch(e){}
    applyLang();
    document.dispatchEvent(new Event('langchange'));
  });
  applyLang();
  document.querySelectorAll('.yr').forEach(function(e){ e.textContent = new Date().getFullYear(); });
})();
</script>
</body>
</html>
